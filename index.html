    <style>
      .vl-boot{display:none}
      html.vl-guest .vl-boot{display:flex}
      .vl-load{min-height:100vh;min-height:100dvh;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(120% 80% at 50% 0%,#f3ecf9 0%,#fbf8fd 55%,#fff 100%);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#5E4D6B;direction:rtl}
      .vl-mark{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;letter-spacing:.42em;padding-inline-start:.42em;color:#5B3278;font-weight:600;background:linear-gradient(100deg,#5B3278 30%,#C5A25D 50%,#5B3278 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:vlshine 2.8s ease-in-out infinite}
      .vl-env{position:relative;width:118px;height:80px;border-radius:12px;border:2px solid #C5A25D;background:linear-gradient(155deg,#5B3278,#4B2366);box-shadow:0 18px 40px -14px rgba(91,50,120,.55);animation:vlfloat 2.6s ease-in-out infinite}
      .vl-env:before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:46px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#6A3C8D,#52296E);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;animation:vlflap 2.6s ease-in-out infinite}
      .vl-env:after{content:"";position:absolute;left:50%;top:36px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4E1B2,#C5A25D 60%,#8F6D2B);box-shadow:0 2px 6px rgba(0,0,0,.3)}
      .vl-txt{font-size:15px;font-weight:600}
      .vl-dots{display:inline-flex;gap:5px;margin-inline-start:6px;vertical-align:middle}
      .vl-dots i{width:6px;height:6px;border-radius:50%;background:#C5A25D;animation:vldot 1.2s infinite ease-in-out}
      .vl-dots i:nth-child(2){animation-delay:.18s}.vl-dots i:nth-child(3){animation-delay:.36s}
      @keyframes vlshine{0%{background-position:120% 0}100%{background-position:-120% 0}}
      @keyframes vlfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes vlflap{0%,100%{transform:rotateX(0)}50%{transform:rotateX(38deg)}}
      @keyframes vldot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
      @media (prefers-reduced-motion:reduce){.vl-mark,.vl-env,.vl-env:before,.vl-dots i{animation:none}}
    </style>
